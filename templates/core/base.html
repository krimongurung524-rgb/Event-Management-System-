<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Event Management System
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        nav {
            background: #1f2937;
            padding: 15px 30px;
        }

        nav .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h1, h2, h3 {
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-success {
            background: #16a34a;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
        }

        footer {
            margin-top: 50px;
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<nav>
    <span class="logo">EventMS</span>

    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'event_list' %}">Events</a>
    <a href="{% url 'category_list' %}">Categories</a>
    <a href="{% url 'organizer_list' %}">Organizers</a>
    <a href="{% url 'venue_list' %}">Venues</a>
    <a href="{% url 'attendee_list' %}">Attendees</a>
    <a href="{% url 'review_list' %}">Reviews</a>
</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>
    <p>© 2026 Event Management System</p>
</footer>

</body>
</html>
