{% extends "core/base.html" %}

{% block title %}Delete Event{% endblock %}

{% block content %}

<div class="card">

    <h1>Delete Event</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ event.title }}</strong>?
    </p>

    <br>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'event_detail' event.pk %}" class="btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
